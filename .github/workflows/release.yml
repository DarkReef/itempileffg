name: Module release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: zip -r itempileffg.zip module.json scripts lang style.css LICENSE README.md
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('module.json')).version")
          gh release create "v${VERSION}" itempileffg.zip module.json --target "$GITHUB_SHA" --draft --generate-notes
